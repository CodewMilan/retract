name: Core checks
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[demo,mcp-test]'
      - run: python -m compileall -q src tests scripts
      - run: python scripts/verify_phase2.py --report reports/phase2.json
      - run: docker compose -f compose.demo.yaml up -d --wait
      - run: python scripts/verify_phase3.py --sdk --postgres --report reports/phase3.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python scripts/verify_phase4.py --browser --report reports/phase4.json
      - run: python scripts/verify_account_settings.py --browser --report reports/account-settings.json
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -c "from pathlib import Path; from zipfile import ZipFile; wheel=next(Path('dist').glob('retract_memory-*.whl')); files=ZipFile(wheel).namelist(); assert all('retract/web/'+name in files for name in ['index.html', 'dashboard.css', 'dashboard.mjs', 'dashboard-model.mjs']); assert all('retract/account_web/'+name in files for name in ['index.html', 'settings.css', 'settings.mjs', 'account-client.mjs'])"
      - run: python scripts/verify_phase1.py --report-dir reports/phase1
      - run: python scripts/verify_phase5.py --report-dir reports/phase5-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification
          path: reports

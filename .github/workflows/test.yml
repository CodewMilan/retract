name: Core checks
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests scripts
      - run: python scripts/verify_phase2.py --report reports/phase2.json
      - run: python scripts/verify_phase1.py --report-dir reports/phase1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification
          path: reports
